services:
  krx-collector:
    image: ghcr.io/kthyeong/krx-collector:latest
    container_name: krx-collector
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - POLARS_MAX_THREADS=2
      - OMP_NUM_THREADS=2
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # 195GB 클라우드 VPS 자원 보호: 메모리 500MB 한도 제한
    mem_limit: 500m
    command: ["uv", "run", "--no-dev", "python", "-m", "src.orchestration.daemon"]
    # 195GB 디스크 보호: 도커 컨테이너 로그 최대 30MB 캡
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
