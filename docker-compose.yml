services:
  krx-collector:
    image: ghcr.io/kthyeong/krx-collector:latest
    container_name: krx-collector
    restart: unless-stopped
    # DB 토큰 발급 가드(분당 1회) 대기 최대 61초 + 정상 종료 여유. 짧으면 대기 중 SIGKILL.
    stop_grace_period: 95s
    env_file:
      - /home/ubuntu/quant-secrets/krx-alpha.env
      - /home/ubuntu/quant-secrets/kis-data.env
    environment:
      - TZ=Asia/Seoul
      - POLARS_MAX_THREADS=2
      - OMP_NUM_THREADS=2
      - KRX_ALPHA_PERSISTENT_LOGS=true
      - KRX_ALPHA_KIS_TOKEN_CACHE_DIR=/run/kis-token-cache
      # kca 07:05 웜업이 1차 발급자. 캐시에 유효 토큰이 없을 때만 krx가 공유 락·당일 가드 하에 발급한다.
      - KRX_ALPHA_KIS_TOKEN_ALLOW_ISSUE=true
      - KRX_ALPHA_AFTER_MARKET_ENABLED=true
      - KRX_ALPHA_SNAPSHOT_ENABLED=true
      # 스냅샷 REST(08:00~15:39, 18TPS)는 DATA_2 전용. DATA_1은 k-closing-alpha 15:20 결정창·
      # 15:30 종가확정 전용이라 공유 시 앱키당 20TPS를 넘어 EGW00201이 난다(실측 09-23 77건).
      - KRX_ALPHA_SNAPSHOT_KIS_DATA_SLOT=2
      # KIS 리테일 웹소켓 커넥션당 41스트림쌍 하드캡(docs/architecture/engineering-decisions.md 검증치)
      - KRX_ALPHA_AFTERMARKET_PAIR_CAPACITY_PER_CONNECTION=41
      # NXT 프리마켓(08:00~08:50) 단일 WS 커넥션. 스냅샷 REST=슬롯 2, k-closing-alpha 15:20 결정창 REST=슬롯 1·5(KIS_DECISION_SHARD_SLOTS=1,5).
      # 슬롯 5는 결정창(15:20)에만 REST로 쓰이고 프리마켓과 시간대·채널(WS)이 겹치지 않는다 (2026-10-03 VPS 실측).
      # 2026-10-06 첫 영업일부터 시험 수집 (V2 미검증, 실패는 프리마켓 자식에 한정)
      - KRX_ALPHA_PREMARKET_ENABLED=true
      - KRX_ALPHA_PREMARKET_CREDENTIAL_SLOT=5
      - KRX_ALPHA_PREMARKET_PAIR_CAPACITY_PER_CONNECTION=41
      # KIS 정규장 코프라이머리 샤드 (정규 확장 Part4; 2026-10-22 G-MEM 통과 후 활성, G-KIS-HEAVY/LOSS/SLOT-COEXIST 관찰 중).
      # 슬롯 1-4 WS 08:28-15:32 (애프터마켓 15:40-20:00·프리마켓 슬롯 5와 비중첩, deploy/shared/kis_slot_assignments.toml).
      - KRX_ALPHA_REGULAR_KIS_CREDENTIAL_SLOTS=["1","2","3","4"]
      - KRX_ALPHA_REGULAR_KIS_PAIR_CAPACITY_PER_CONNECTION=41
      - KRX_ALPHA_REGULAR_KIS_ENABLED=true
      # 2층 유니버스 (Part5; 2026-10-22 G-UNIVERSE 오프라인 20일 재현 PASS: 코어 65-71, 교체율 최대 4.2%).
      # 코어가 후보 앞쪽(거래대금 순)을 차지하므로 KIS 샤드 0이 최대 거래대금 20종목이 되어 G-KIS-HEAVY 조건을 충족한다.
      - KRX_ALPHA_UNIVERSE_CORE_ENABLED=true
      # History backfill 야간 슬롯 23:30-05:30 (Part 2). 2026-10-22 G-TAPE-RUN PASS: 47 종목일 틱 거래량 합이 KRX 일봉과 ±0.5% 이내 전수 일치.
      # 키움 ka10079는 kca와 호스트 공유 페이서(~/.cache/kis admission_kiwoom_*_ka10079.state)로 예산을 나눈다.
      - KRX_ALPHA_TICK_TAPE_ENABLED=true
      # L0 복구 게이트 (2026-10-24 G-REPAIR-RUN 통과: 최대 544MiB, 10-20~23 병합 OK). 복구·병합 전 L0 삭제 보류, 최대 7일 후 CRITICAL 로그와 함께 만료.
      - KRX_ALPHA_REPAIR_JOB_ENABLED=true
      - KRX_ALPHA_REPAIR_HOLD_ENABLED=true
      - KRX_ALPHA_REPAIR_MERGE_REQUIRED=true
      # 분봉 백필은 Toss가 KRX+NXT 통합 테이프라 G-MINUTE FAIL; KIS 소스 전환(Part 5) 전까지 비활성.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /home/ubuntu/.config/rclone:/root/.config/rclone:ro
      - /home/ubuntu/.cache/kis:/run/kis-token-cache
      # 호스트 백업 스크립트만 쓰는 상태 디렉터리(컨테이너는 읽기 전용). 컨테이너 시작 전에 ubuntu 소유로 존재해야 하며, 없으면 Docker가 root 소유로 만든다.
      - /home/ubuntu/.local/state/krx-alpha:/run/host-backup:ro
    # regular-session expansion: EOD normalizer child peak scales ~linearly with partition rows; 3g covers a 6x partition with daemon resident
    mem_limit: 3g
    memswap_limit: 3g
    command: ["/app/.venv/bin/python", "-m", "src.orchestration.daemon"]
    # 195GB 디스크 보호: 도커 컨테이너 로그 최대 30MB 캡
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
