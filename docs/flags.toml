kind = "legacy_rollout"
default = false
reason = "REST snapshot collection; production enables it through compose and the harness tests use disabled as baseline."
exit_condition = "daemon test harness no longer uses the disabled baseline: flip the default to True and delete the compose line, or delete the toggle"
