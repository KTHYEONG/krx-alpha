<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" style="font-family:Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>KRX-Alpha 핵심 엔지니어링 지표 및 24/7 파이프라인</title>
  <desc>장중 파싱 0%, 99.5% 결손 복원, 10호가 스윕 섀도 OMS, 3,041개 테스트로 검증된 KRX-Alpha 개요</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" data-paint-static="true"/>
    </filter>
  </defs>
  <rect width="1200" height="530" fill="#F7F7F5" data-fill-role="canvas"/>

  <!-- Header -->
  <g>
    <rect data-fill-role="focus" x="48" y="47" width="6" height="42" rx="3" fill="#2E6DA4"/>
    <text data-fill-role="muted" x="70" y="38" font-size="13.5" font-weight="700" letter-spacing="0.08em" fill="#4A5568" dominant-baseline="central">KRX-ALPHA · QUANT DATA &amp; EXECUTION INFRASTRUCTURE</text>
    <text data-fill-role="ink" x="70" y="68" font-size="28" font-weight="700" fill="#252B35" dominant-baseline="central">무손실 고빈도 틱 파이프라인 &amp; 실계좌 섀도 OMS</text>
    <text data-fill-role="ink" x="70" y="100" font-size="15" font-weight="600" fill="#252B35" dominant-baseline="central">수집(L0) · 검증(L1) · 주문(OMS)을 물리 분리한 24/7 무인 퀀트 인프라</text>
  </g>

  <!-- 3 Key Metric Cards -->
  <!-- Card 1 -->
  <g>
    <rect x="48" y="136" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="70" y="158" width="144" height="28" rx="14" fill="#EAF0F6" stroke="#2E6DA4" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="142" y="172" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#193C5A" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">LOSSLESS L0</text>
    <circle cx="360" cy="172" r="22" fill="#EAF0F6" data-fill-role="edge-fill"/>
    <g transform="translate(348,160) scale(1)"><path d="M4 6 A8 3 0 1 0 20 6 A8 3 0 1 0 4 6 M4 6 V18 A8 3 0 0 0 20 18 V6" fill="none" stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/></g>
    
    <text x="70" y="244" font-size="52" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">0%</text>
    <text x="70" y="296" font-size="19" font-weight="700" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">장중 파싱 오버헤드</text>
    <text x="70" y="328" font-size="14.5" font-weight="600" fill="#193C5A" data-fill-role="edge-ink" dominant-baseline="central">Append-Only zstd 원문 직렬화</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="424" y="136" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#3F8F72" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="446" y="158" width="144" height="28" rx="14" fill="#ECF4F1" stroke="#3F8F72" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="518" y="172" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#234F3F" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">GAP-FILL AUDIT</text>
    <circle cx="736" cy="172" r="22" fill="#ECF4F1" data-fill-role="compute-fill"/>
    <g transform="translate(724,160) scale(1)"><path d="M4.5 12 A7.5 7.5 0 0 1 17.3 6.7 L20 9 M20 3.5 V9 H14.5 M19.5 12 A7.5 7.5 0 0 1 6.7 17.3 L4 15 M4 20.5 V15 H9.5" fill="none" stroke="#3F8F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="compute-line"/></g>
    
    <text x="446" y="244" font-size="52" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">99.5%</text>
    <text x="446" y="296" font-size="19" font-weight="700" fill="#234F3F" data-fill-role="compute-ink" dominant-baseline="central">개장 결손 틱 복원율</text>
    <text x="446" y="328" font-size="14.5" font-weight="600" fill="#234F3F" data-fill-role="compute-ink" dominant-baseline="central">누적 번호 감사 &amp; 3단 교차 백필</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="800" y="136" width="352" height="236" rx="16" fill="#FFFFFF" stroke="#5B54A8" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line" filter="url(#card-shadow)"/>
    <rect x="822" y="158" width="144" height="28" rx="14" fill="#EFEEF6" stroke="#5B54A8" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="894" y="172" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#322E5C" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">SHADOW OMS</text>
    <circle cx="1112" cy="172" r="22" fill="#EFEEF6" data-fill-role="api-fill"/>
    <g transform="translate(1100,160) scale(1)"><path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z" fill="none" stroke="#5B54A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/></g>
    
    <text x="822" y="244" font-size="52" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">10호가</text>
    <text x="822" y="296" font-size="19" font-weight="700" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">실시간 잔량 순차 스윕</text>
    <text x="822" y="328" font-size="14.5" font-weight="600" fill="#322E5C" data-fill-role="api-ink" dominant-baseline="central">모의·실전 동일 리스크 게이트</text>
  </g>

  <!-- Bottom 4-Stage Horizontal Pipeline Strip -->
  <g>
    <rect x="48" y="394" width="1104" height="106" rx="14" fill="#FFFFFF" stroke="#DEE0E2" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule" filter="url(#card-shadow)"/>
    
    <!-- Stage 1 -->
    <text x="74" y="434" font-size="15.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">01. 무파싱 수집 (L0)</text>
    <text x="74" y="466" font-size="13.5" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">08:00~20:00 · 1,586 msg/s 버스트</text>

    <!-- Chevron 1 -->
    <path d="M308 440 L318 447 L308 454" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="focus"/>

    <!-- Stage 2 -->
    <text x="350" y="434" font-size="15.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">02. 벡터 정규화 (L1)</text>
    <text x="350" y="466" font-size="13.5" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">Polars Parquet · 단조성 DQ 검증</text>

    <!-- Chevron 2 -->
    <path d="M584 440 L594 447 L584 454" fill="none" stroke="#3F8F72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="positive"/>

    <!-- Stage 3 -->
    <text x="626" y="434" font-size="15.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">03. 원격 백업 &amp; 순환</text>
    <text x="626" y="466" font-size="13.5" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">Google Drive 100% 바이트 대사</text>

    <!-- Chevron 3 -->
    <path d="M860 440 L870 447 L860 454" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="focus"/>

    <!-- Stage 4 -->
    <text x="902" y="434" font-size="15.5" font-weight="700" fill="#252B35" data-fill-role="ink" dominant-baseline="central">04. 섀도 매매 &amp; 가드</text>
    <text x="902" y="466" font-size="13.5" font-weight="600" fill="#252B35" data-fill-role="ink" dominant-baseline="central">10호가 잔량 스윕 · AST 불변식</text>
  </g>
</svg>