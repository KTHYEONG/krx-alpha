<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" style="font-family:Pretendard, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>KRX-Alpha 4-Zone 시스템 아키텍처 토폴로지</title>
  <desc>외부 벤더 연동, 장중 무파싱 적재, EOD 정합성 검증 및 원격 백업, 섀도 OMS 및 AST 가드로 구성된 4계층 구조</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" data-paint-static="true"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#16191E" data-fill-role="canvas"/>

  <!-- Header -->
  <g>
    <rect data-fill-role="focus" x="48" y="41" width="6" height="42" rx="3" fill="#2E6DA4"/>
    <text data-fill-role="muted" x="70" y="32" font-size="13.5" font-weight="700" letter-spacing="0.08em" fill="#9BA1A8" dominant-baseline="central">SYSTEM ARCHITECTURE · 4-ZONE PIPELINE TOPOLOGY</text>
    <text data-fill-role="ink" x="70" y="62" font-size="26" font-weight="700" fill="#E6E8EB" dominant-baseline="central">장중 무파싱 수집과 장마감 벡터 검증의 이중 파이프라인</text>
    <text data-fill-role="ink" x="70" y="94" font-size="14.5" font-weight="400" fill="#9BA1A8" dominant-baseline="central">수집 지연과 데이터 결손을 원천 차단하는 4단계 아키텍처 토폴로지</text>
  </g>

  <!-- ZONE 01: External Vendors -->
  <g>
    <rect x="48" y="124" width="1104" height="106" rx="14" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule" filter="url(#card-shadow)"/>
    <rect x="64" y="140" width="144" height="74" rx="10" fill="#1D2B3A" stroke="#2E6DA4" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="136" y="164" font-size="12.5" font-weight="700" fill="#B0D3F0" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">ZONE 01</text>
    <text x="136" y="188" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" text-anchor="middle" dominant-baseline="central">4대 금융 벤더</text>

    <!-- 4 Vendors -->
    <g>
      <rect x="224" y="140" width="216" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="165" font-size="14.5" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">토스증권 REST</text>
      <text x="240" y="189" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">영업일 캘린더 · 프로그램</text>
    </g>
    <g>
      <rect x="452" y="140" width="216" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="468" y="165" font-size="14.5" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">KRX 정보데이터</text>
      <text x="468" y="189" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">전종목 일봉 (≥90% 완결)</text>
    </g>
    <g>
      <rect x="680" y="140" width="216" height="74" rx="10" fill="#20242B" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line"/>
      <text x="696" y="165" font-size="14.5" font-weight="700" fill="#B0D3F0" data-fill-role="edge-ink" dominant-baseline="central">LS증권 WebSocket</text>
      <text x="696" y="189" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">정규장 체결 &amp; 10호가</text>
    </g>
    <g>
      <rect x="908" y="140" width="228" height="74" rx="10" fill="#20242B" stroke="#5B54A8" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line"/>
      <text x="924" y="165" font-size="14.5" font-weight="700" fill="#D1CDEE" data-fill-role="api-ink" dominant-baseline="central">한국투자증권</text>
      <text x="924" y="189" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">프리·정규·애프터 (4계정)</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M600 230 V256" fill="none" stroke="#2E6DA4" stroke-width="2.5" stroke-linecap="round" data-stroke-role="focus"/>
  <path d="M594 250 L600 258 L606 250" fill="none" stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="focus"/>

  <!-- ZONE 02: Ingestion -->
  <g>
    <rect x="48" y="264" width="1104" height="106" rx="14" fill="#20242B" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="64" y="280" width="144" height="74" rx="10" fill="#1D2B3A" stroke="#2E6DA4" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="136" y="304" font-size="12.5" font-weight="700" fill="#B0D3F0" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">ZONE 02</text>
    <text x="136" y="328" font-size="14.5" font-weight="700" fill="#B0D3F0" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">장전 선별·수집</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="280" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="305" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">T-1 확정 종가 선별</text>
      <text x="240" y="329" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">상위 100종목 확정 (미래참조 차단)</text>
    </g>
    <g>
      <rect x="532" y="280" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="305" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">무차단 WebSocket 수집기</text>
      <text x="548" y="329" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">나노초 수신시각(recv_ts) 즉시 기록</text>
    </g>
    <g>
      <rect x="840" y="280" width="296" height="74" rx="10" fill="#1D2B3A" stroke="#2E6DA4" stroke-width="1.5" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
      <text x="856" y="305" font-size="15" font-weight="700" fill="#B0D3F0" data-fill-role="edge-ink" dominant-baseline="central">Append-Only L0 저널</text>
      <text x="856" y="329" font-size="13" font-weight="400" fill="#B0D3F0" data-fill-role="edge-ink" dominant-baseline="central">장중 파싱 0% · .jsonl.zst 실시간 압축</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M600 370 V396" fill="none" stroke="#3F8F72" stroke-width="2.5" stroke-linecap="round" data-stroke-role="positive"/>
  <path d="M594 390 L600 398 L606 390" fill="none" stroke="#3F8F72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="positive"/>

  <!-- ZONE 03: Validation & Backup -->
  <g>
    <rect x="48" y="404" width="1104" height="106" rx="14" fill="#20242B" stroke="#3F8F72" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="64" y="420" width="144" height="74" rx="10" fill="#1E3029" stroke="#3F8F72" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="136" y="444" font-size="12.5" font-weight="700" fill="#AEE0CE" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">ZONE 03</text>
    <text x="136" y="468" font-size="14.5" font-weight="700" fill="#AEE0CE" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">정합성 &amp; 백업</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="420" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="445" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">체결 감사 &amp; 3단 갭필</text>
      <text x="240" y="469" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">누적 번호 감사 · 키움/한투 99.5% 복원</text>
    </g>
    <g>
      <rect x="532" y="420" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="445" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">Polars L1 Parquet 정규화</text>
      <text x="548" y="469" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">10호가 단조성 &amp; 거래량 보존 검증</text>
    </g>
    <g>
      <rect x="840" y="420" width="296" height="74" rx="10" fill="#1E3029" stroke="#3F8F72" stroke-width="1.5" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
      <text x="856" y="445" font-size="15" font-weight="700" fill="#AEE0CE" data-fill-role="compute-ink" dominant-baseline="central">원격 백업 &amp; 바이트 대사</text>
      <text x="856" y="469" font-size="13" font-weight="400" fill="#AEE0CE" data-fill-role="compute-ink" dominant-baseline="central">Google Drive 100% 일치 시 로컬 순환</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <path d="M600 510 V536" fill="none" stroke="#5B54A8" stroke-width="2.5" stroke-linecap="round" data-stroke-role="api-line"/>
  <path d="M594 530 L600 538 L606 530" fill="none" stroke="#5B54A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/>

  <!-- ZONE 04: Execution & Guard -->
  <g>
    <rect x="48" y="544" width="1104" height="106" rx="14" fill="#20242B" stroke="#5B54A8" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line" filter="url(#card-shadow)"/>
    <rect x="64" y="560" width="144" height="74" rx="10" fill="#28253B" stroke="#5B54A8" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="136" y="584" font-size="12.5" font-weight="700" fill="#D1CDEE" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">ZONE 04</text>
    <text x="136" y="608" font-size="14.5" font-weight="700" fill="#D1CDEE" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">섀도 OMS·가드</text>

    <!-- 3 Blocks -->
    <g>
      <rect x="224" y="560" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="240" y="585" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">사전 리스크 게이트</text>
      <text x="240" y="609" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">주문 금액·미체결 한도 사전 통제</text>
    </g>
    <g>
      <rect x="532" y="560" width="292" height="74" rx="10" fill="#20242B" stroke="#333842" stroke-width="1.5" data-fill-role="surface" data-stroke-role="rule"/>
      <text x="548" y="585" font-size="15" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">10호가 스윕 섀도 체결</text>
      <text x="548" y="609" font-size="13" font-weight="400" fill="#9BA1A8" data-fill-role="muted" dominant-baseline="central">실시간 잔량 순차 차감 · 실계좌 격리</text>
    </g>
    <g>
      <rect x="840" y="560" width="296" height="74" rx="10" fill="#28253B" stroke="#5B54A8" stroke-width="1.5" data-fill-role="api-fill" data-stroke-role="api-line"/>
      <text x="856" y="585" font-size="15" font-weight="700" fill="#D1CDEE" data-fill-role="api-ink" dominant-baseline="central">AST 계층 불변식 검증</text>
      <text x="856" y="609" font-size="13" font-weight="400" fill="#D1CDEE" data-fill-role="api-ink" dominant-baseline="central">Layer 0~7 단방향 참조 강제 (위반 0건)</text>
    </g>
  </g>
</svg>