    <text x="163" y="155" font-size="11.5" font-weight="700" letter-spacing="0.06em" fill="#B0D3F0" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">CASE 01 · DATA REPAIR</text>
    <text x="68" y="190" font-size="20" font-weight="700" fill="#E6E8EB" data-fill-role="ink" dominant-baseline="central">09:00 개장 틱 누락 복구</text>
    
    <!-- Problem Pill -->
