    <text data-fill-role="muted" x="70" y="32" font-size="13.5" font-weight="700" letter-spacing="0.08em" fill="#9BA1A8" dominant-baseline="central">ENGINEERING DEEP DIVES · PROBLEM SOLVING</text>
    <text data-fill-role="ink" x="70" y="62" font-size="26" font-weight="700" fill="#E6E8EB" dominant-baseline="central">실제 운영 장애와 리소스 한계를 돌파한 3대 엔지니어링 해법</text>
    <text data-fill-role="ink" x="70" y="94" font-size="14.5" font-weight="400" fill="#9BA1A8" dominant-baseline="central">데이터 결손 복원, 스토리지 고갈 방어, 오주문 원천 차단을 코드와 실측 수치로 증명합니다</text>
  </g>

  <!-- CASE 01: Horizontal Card -->
