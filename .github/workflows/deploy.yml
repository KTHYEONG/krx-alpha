name: Cloud CI/CD Deploy Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kthyeong/krx-collector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Ampere ARM64 + AMD64 멀티아키텍처 크로스 빌드
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale 가상 사설망 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # SSH 배포 실행
      - name: Deploy over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          # Multiline, allow-listed data-key fragment.  The secret is optional
          # only when the VPS fragment has already been provisioned.
          KIS_DATA_ENV_CONTENT: ${{ secrets.KIS_DATA_ENV_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          KIS_DATA_ENV_B64="$(printf '%s' "$KIS_DATA_ENV_CONTENT" | base64 | tr -d '\n')"

          # 원격 서버 디렉터리 준비
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/krx-alpha/data ~/krx-alpha/logs"

          # docker-compose.yml 전송
          scp $SSH_OPTS docker-compose.yml "$REMOTE_USER@$HOST:~/krx-alpha/"

          # 원격 컨테이너 최신 이미지 pull 및 재기동
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" bash -s <<EOF
          set -e
          cd ~/krx-alpha

          DATA_ENV_FILE="\$HOME/quant-secrets/kis-data.env"
          mkdir -p "\$(dirname "\$DATA_ENV_FILE")"

          # Provision the shared data-key fragment once, or refresh it only when
          # the explicitly supplied GitHub secret is present. Never derive it
          # from a project .env and never copy trade credentials into it.
          if [ -n '$KIS_DATA_ENV_B64' ]; then
            tmp_file="\$(mktemp "\$DATA_ENV_FILE.XXXXXX")"
            printf '%s' '$KIS_DATA_ENV_B64' | base64 --decode > "\$tmp_file"
            if grep -Eq '^(KIS_APP_|KIS_TRADE_)' "\$tmp_file"; then
              echo "Shared KIS data env contains a primary/trade credential" >&2
              rm -f "\$tmp_file"
              exit 1
            fi
            if ! awk -F= '
              /^[[:space:]]*($|#)/ { next }
              !/^[A-Za-z_][A-Za-z0-9_]*=/ { exit 1 }
              \$1 !~ /^KIS_(DATA_SLOTS|HOST_DATA_SLOTS|DATA_[1-5]_(APP_KEY|APP_SECRET|HTS_ID))$/ { exit 1 }
            ' "\$tmp_file"; then
              echo "Shared KIS data env contains a non-data or account field" >&2
              rm -f "\$tmp_file"
              exit 1
            fi
            for required_key in \
              KIS_DATA_SLOTS KIS_HOST_DATA_SLOTS \
              KIS_DATA_1_APP_KEY KIS_DATA_1_APP_SECRET KIS_DATA_1_HTS_ID \
              KIS_DATA_2_APP_KEY KIS_DATA_2_APP_SECRET KIS_DATA_2_HTS_ID \
              KIS_DATA_3_APP_KEY KIS_DATA_3_APP_SECRET KIS_DATA_3_HTS_ID \
              KIS_DATA_4_APP_KEY KIS_DATA_4_APP_SECRET KIS_DATA_4_HTS_ID \
              KIS_DATA_5_APP_KEY KIS_DATA_5_APP_SECRET KIS_DATA_5_HTS_ID; do
              grep -Eq "^"\$required_key"=.+$" "\$tmp_file" || {
                echo "Missing required shared KIS data key: "\$required_key >&2
                rm -f "\$tmp_file"
                exit 1
              }
            done
            chmod 600 "\$tmp_file"
            mv -f "\$tmp_file" "\$DATA_ENV_FILE"
          fi
          if [ ! -s "\$DATA_ENV_FILE" ]; then
            echo "Missing \$DATA_ENV_FILE; set the KIS_DATA_ENV_CONTENT repository secret or provision it manually" >&2
            exit 1
          fi
          chmod 600 "\$DATA_ENV_FILE"

          # .env 파일이 없으면 템플릿 생성 안내 (기존 .env 보존)
          if [ ! -f .env ]; then
            touch .env
            echo "Created empty .env. Please configure API credentials if not already set."
          fi

          upsert_env() {
            key="\$1"
            value="\$2"
            if grep -q "^\$key=" .env; then
              sed -i "s#^\$key=.*#\$key=\$value#" .env
            else
              printf '%s=%s\n' "\$key" "\$value" >> .env
            fi
          }
          upsert_env KIS_DATA_ENV_FILE "\$DATA_ENV_FILE"
          upsert_env KIS_SHARED_TOKEN_CACHE_DIR "\$HOME/.cache/kis"

          # KCA reads the same shared fragment through its user-systemd unit.
          DROPIN_DIR="\$HOME/.config/systemd/user/kca-kis-token-warmup.service.d"
          mkdir -p "\$DROPIN_DIR"
          printf '[Service]\nEnvironmentFile=%s\n' "\$DATA_ENV_FILE" > "\$DROPIN_DIR/10-kis-data-env.conf"
          chmod 600 "\$DROPIN_DIR/10-kis-data-env.conf"
          systemctl --user daemon-reload
          systemctl --user enable --now kca-kis-token-warmup.timer
          systemctl --user restart kca-kis-token-warmup.service

          # rclone config directory bootstrap (directory mount follows host re-authorization)
          mkdir -p ~/.config/rclone
          if [ ! -f ~/.config/rclone/rclone.conf ]; then
            echo "WARNING: ~/.config/rclone/rclone.conf is missing. Please configure rclone remote credentials manually."
          fi

          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          if docker compose version >/dev/null 2>&1; then C="docker compose"; else C="docker-compose"; fi
          \$C pull
          \$C up -d --force-recreate --remove-orphans
          docker image prune -f
          EOF
