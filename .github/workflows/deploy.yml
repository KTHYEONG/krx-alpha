name: Cloud CI/CD Deploy Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-or-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kthyeong/krx-collector

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Ampere ARM64 네이티브 단일 아키텍처 빌드
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale 가상 사설망 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # SSH 배포 실행
      - name: Deploy over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"

          # 1. Stage: live 경로에는 쓰지 않고 스테이징에만 적재한다.
          STAGING_DIR=".deploy/staging/$GITHUB_SHA"
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/krx-alpha/data ~/krx-alpha/logs ~/krx-alpha/deploy/host ~/.local/state/krx-alpha ~/.config/systemd/user ~/krx-alpha/$STAGING_DIR"

          # docker-compose.yml 스테이징
          scp $SSH_OPTS docker-compose.yml "$REMOTE_USER@$HOST:~/krx-alpha/$STAGING_DIR/docker-compose.yml"

          # 호스트 백업 스크립트/필터/유닛 스테이징
          scp $SSH_OPTS deploy/host/krx-host-backup.sh "$REMOTE_USER@$HOST:~/krx-alpha/$STAGING_DIR/krx-host-backup.sh"
          scp $SSH_OPTS deploy/host/krx-alpha.rclone-filter "$REMOTE_USER@$HOST:~/krx-alpha/$STAGING_DIR/krx-alpha.rclone-filter"
          scp $SSH_OPTS deploy/host/krx-host-backup.service deploy/host/krx-host-backup.timer "$REMOTE_USER@$HOST:~/krx-alpha/$STAGING_DIR/"
          scp $SSH_OPTS deploy/host/krx-deferred-recreate.service deploy/host/krx-deferred-recreate.timer "$REMOTE_USER@$HOST:~/krx-alpha/$STAGING_DIR/"

          # Deploy session gate: defer in-session recreate to the 22:00 KST timer.
          set +e
          python3 -m src.orchestration.deploy_gate
          GATE_RC=$?
          set -e
          if [ "$GATE_RC" -ne 0 ] && [ "$GATE_RC" -ne 10 ]; then
            echo "deploy gate failed with rc=$GATE_RC" >&2
            exit 1
          fi
          if [ "$GATE_RC" -eq 0 ]; then RECREATE_NOW=1; else RECREATE_NOW=0; fi

          # 원격 컨테이너 핀 이미지 배포 및 재기동
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "GITHUB_SHA=$GITHUB_SHA RECREATE_NOW=$RECREATE_NOW bash -s" <<EOF
          set -euo pipefail
          cd ~/krx-alpha
          STAGING_DIR=".deploy/staging/\$GITHUB_SHA"

          DATA_ENV_FILE="/home/ubuntu/quant-secrets/kis-data.env"
          RUNTIME_ENV_FILE="/home/ubuntu/quant-secrets/krx-alpha.env"

          # CI never provisions credentials: the shared fragment is installed
          # once from a trusted workstation at the canonical absolute path
          # /home/ubuntu/quant-secrets/kis-data.env and only validated here.
          # This validator fails closed and prints only fixed text and key
          # names, never credential values.
          validate_shared_keypool() {
            file="\$1"
            if [ ! -s "\$file" ]; then
              echo "Missing shared KIS data env" >&2
              echo "Hint: run uv run python -m src.cli.provision_kis_keypool --host or-vps from a trusted workstation" >&2
              return 1
            fi
            mode="\$(stat -c %a "\$file")"
            if [ "\$mode" != "600" ]; then
              echo "Shared KIS data env has unexpected mode" >&2
              return 1
            fi
            owner="\$(stat -c %U:%G "\$file")"
            if [ "\$owner" != "ubuntu:ubuntu" ]; then
              echo "Shared KIS data env has unexpected owner" >&2
              return 1
            fi
            unexpected_key="\$(awk -F= '
              /^[[:space:]]*(#|$)/ { next }
              \$1 !~ /^KIS_(DATA_SLOTS|HOST_DATA_SLOTS|DATA_[1-5]_(APP_KEY|APP_SECRET|HTS_ID))$/ { print \$1; exit 1 }
            ' "\$file")"
            if [ -n "\$unexpected_key" ]; then
              echo "Shared KIS data env contains an unexpected key: \$unexpected_key" >&2
              return 1
            fi
            slots_value="\$(awk -F= '\$1 == "KIS_DATA_SLOTS" { print substr(\$0, index(\$0, "=") + 1); exit }' "\$file")"
            expected_slots_line="KIS_DATA_SLOTS=1,2,3,4,5"
            if [ "\$slots_value" != "\${expected_slots_line#*=}" ]; then
              echo "Shared KIS data env has unexpected KIS_DATA_SLOTS assignment" >&2
              return 1
            fi
            host_slots_value="\$(awk -F= '\$1 == "KIS_HOST_DATA_SLOTS" { print substr(\$0, index(\$0, "=") + 1); exit }' "\$file")"
            expected_host_slots_line="KIS_HOST_DATA_SLOTS=1,2,3,4"
            if [ "\$host_slots_value" != "\${expected_host_slots_line#*=}" ]; then
              echo "Shared KIS data env has unexpected KIS_HOST_DATA_SLOTS assignment" >&2
              return 1
            fi
            for required_key in \
              KIS_DATA_1_APP_KEY KIS_DATA_1_APP_SECRET KIS_DATA_1_HTS_ID \
              KIS_DATA_2_APP_KEY KIS_DATA_2_APP_SECRET KIS_DATA_2_HTS_ID \
              KIS_DATA_3_APP_KEY KIS_DATA_3_APP_SECRET KIS_DATA_3_HTS_ID \
              KIS_DATA_4_APP_KEY KIS_DATA_4_APP_SECRET KIS_DATA_4_HTS_ID \
              KIS_DATA_5_APP_KEY KIS_DATA_5_APP_SECRET KIS_DATA_5_HTS_ID; do
              credential_value="\$(awk -F= -v key="\$required_key" '\$1 == key { print substr(\$0, index(\$0, "=") + 1); exit }' "\$file")"
              if [ -z "\$credential_value" ]; then
                echo "Missing required shared KIS data key: \$required_key" >&2
                echo "Hint: run uv run python -m src.cli.provision_kis_keypool --host or-vps from a trusted workstation" >&2
                return 1
              fi
            done
            echo "Shared KIS data env validated: 17 keys"
          }
          validate_shared_keypool "\$DATA_ENV_FILE"

          # CI never provisions credentials: the runtime fragment is installed
          # once from a trusted workstation at the canonical absolute path
          # /home/ubuntu/quant-secrets/krx-alpha.env and only validated here.
          # This validator fails closed and prints only fixed text and key
          # names, never credential values.
          validate_runtime_env() {
            file="\$1"
            if [ ! -s "\$file" ]; then
              echo "Missing runtime env" >&2
              echo "Hint: run uv run python -m src.cli.provision_kis_keypool --host or-vps from a trusted workstation" >&2
              return 1
            fi
            mode="\$(stat -c %a "\$file")"
            if [ "\$mode" != "600" ]; then
              echo "Runtime env has unexpected mode" >&2
              return 1
            fi
            owner="\$(stat -c %U:%G "\$file")"
            if [ "\$owner" != "ubuntu:ubuntu" ]; then
              echo "Runtime env has unexpected owner" >&2
              return 1
            fi
            unexpected_key="\$(awk -F= '
              /^[[:space:]]*(#|$)/ { next }
              \$1 !~ /^(KRX_OPENAPI_KEY|TOSS_APP_KEY|TOSS_APP_SECRET|LS_APP_KEY|LS_APP_SECRET|KIS_APP_KEY|KIS_APP_SECRET|KIS_ACCOUNT_NO|KIS_ACCOUNT_PRODUCT_CODE|ALERT_GMAIL_USER|ALERT_GMAIL_APP_PASSWORD|ALERT_GMAIL_TO|KRX_ALPHA_LIVENESS_HEALTHCHECK_URL|KRX_HOST_BACKUP_HEALTHCHECK_URL)$/ { print \$1; exit 1 }
            ' "\$file")"
            if [ -n "\$unexpected_key" ]; then
              echo "Runtime env contains an unexpected key: \$unexpected_key" >&2
              return 1
            fi
            for required_key in \
              KRX_OPENAPI_KEY TOSS_APP_KEY TOSS_APP_SECRET \
              LS_APP_KEY LS_APP_SECRET \
              KIS_APP_KEY KIS_APP_SECRET KIS_ACCOUNT_NO KIS_ACCOUNT_PRODUCT_CODE \
              ALERT_GMAIL_USER ALERT_GMAIL_APP_PASSWORD ALERT_GMAIL_TO \
              KRX_ALPHA_LIVENESS_HEALTHCHECK_URL KRX_HOST_BACKUP_HEALTHCHECK_URL; do
              credential_value="\$(awk -F= -v key="\$required_key" '\$1 == key { print substr(\$0, index(\$0, "=") + 1); exit }' "\$file")"
              if [ -z "\$credential_value" ]; then
                echo "Missing required runtime env key: \$required_key" >&2
                echo "Hint: run uv run python -m src.cli.provision_kis_keypool --host or-vps from a trusted workstation" >&2
                return 1
              fi
            done
            echo "Runtime env validated: 14 keys"
          }
          validate_runtime_env "\$RUNTIME_ENV_FILE"

          # 토큰은 러너에서 heredoc 본문(stdin)으로만 확장한다: ssh 명령 인자나 원격 환경변수에 싣지 않는다.
          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker pull ghcr.io/kthyeong/krx-collector:sha-\$GITHUB_SHA
          pulled_revision="\$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' ghcr.io/kthyeong/krx-collector:sha-\$GITHUB_SHA)"
          if [ "\$pulled_revision" != "\$GITHUB_SHA" ]; then
            echo "Image revision mismatch: \$pulled_revision != \$GITHUB_SHA" >&2
            exit 1
          fi
          docker tag ghcr.io/kthyeong/krx-collector:sha-\$GITHUB_SHA ghcr.io/kthyeong/krx-collector:latest

          # 4. Promote: staged 파일을 원자적으로 교체한다 (rename은 새 inode를 준다).
          install -m 644 "\$STAGING_DIR/docker-compose.yml" ~/krx-alpha/docker-compose.yml.new && mv -f ~/krx-alpha/docker-compose.yml.new ~/krx-alpha/docker-compose.yml
          install -m 755 "\$STAGING_DIR/krx-host-backup.sh" ~/krx-alpha/deploy/host/krx-host-backup.sh.new && mv -f ~/krx-alpha/deploy/host/krx-host-backup.sh.new ~/krx-alpha/deploy/host/krx-host-backup.sh
          install -m 644 "\$STAGING_DIR/krx-alpha.rclone-filter" ~/krx-alpha/deploy/host/krx-alpha.rclone-filter.new && mv -f ~/krx-alpha/deploy/host/krx-alpha.rclone-filter.new ~/krx-alpha/deploy/host/krx-alpha.rclone-filter
          install -m 644 "\$STAGING_DIR/krx-host-backup.service" ~/.config/systemd/user/krx-host-backup.service.new && mv -f ~/.config/systemd/user/krx-host-backup.service.new ~/.config/systemd/user/krx-host-backup.service
          install -m 644 "\$STAGING_DIR/krx-host-backup.timer" ~/.config/systemd/user/krx-host-backup.timer.new && mv -f ~/.config/systemd/user/krx-host-backup.timer.new ~/.config/systemd/user/krx-host-backup.timer
          install -m 644 "\$STAGING_DIR/krx-deferred-recreate.service" ~/.config/systemd/user/krx-deferred-recreate.service.new && mv -f ~/.config/systemd/user/krx-deferred-recreate.service.new ~/.config/systemd/user/krx-deferred-recreate.service
          install -m 644 "\$STAGING_DIR/krx-deferred-recreate.timer" ~/.config/systemd/user/krx-deferred-recreate.timer.new && mv -f ~/.config/systemd/user/krx-deferred-recreate.timer.new ~/.config/systemd/user/krx-deferred-recreate.timer

          # KCA reads the same shared fragment through its user-systemd unit.
          DROPIN_DIR="\$HOME/.config/systemd/user/kca-kis-token-warmup.service.d"
          if systemctl --user cat kca-kis-token-warmup.timer >/dev/null 2>&1; then
            mkdir -p "\$DROPIN_DIR"
            printf '[Service]\nEnvironmentFile=%s\n' "\$DATA_ENV_FILE" > "\$DROPIN_DIR/10-kis-data-env.conf"
            chmod 600 "\$DROPIN_DIR/10-kis-data-env.conf"
            systemctl --user daemon-reload
            systemctl --user enable --now kca-kis-token-warmup.timer
          else
            echo "WARNING: kca-kis-token-warmup.timer not installed; krx issues tokens itself (KRX_ALPHA_KIS_TOKEN_ALLOW_ISSUE=true)"
          fi
          chmod +x ~/krx-alpha/deploy/host/krx-host-backup.sh
          systemctl --user daemon-reload
          systemctl --user enable --now krx-host-backup.timer
          systemctl --user enable --now krx-deferred-recreate.timer
          # 공용 quant-lake 타이머 폐기 가드: PROJECTS 항목이 krx-alpha뿐일 때만 폐기한다.
          # 원격 셸에서 평가되도록 \$ 이스케이프(비인용 heredoc은 러너에서 먼저 확장된다).
          # QUANT_LAKE_RETIRE_GUARD_BEGIN
          if [ -f ~/.config/systemd/user/quant-lake-backup.timer ] && [ -f ~/bin/quant-lake-backup.sh ]; then
            other_projects=\$(grep -E '^[[:space:]]*\[[^]]+\]=' ~/bin/quant-lake-backup.sh | grep -cv '\[krx-alpha\]' || true)
            if [ "\$other_projects" -eq 0 ]; then
              systemctl --user disable --now quant-lake-backup.timer || true
              rm -f ~/.config/systemd/user/quant-lake-backup.timer ~/.config/systemd/user/quant-lake-backup.service
              rm -rf ~/.config/systemd/user/quant-lake-backup.service.d
              mv ~/bin/quant-lake-backup.sh ~/bin/quant-lake-backup.sh.retired.\$(date -u +%Y%m%dT%H%M%SZ)
            else
              echo "WARNING: shared quant-lake-backup.sh still serves other PROJECTS; leaving quant-lake-backup.timer untouched" >&2
            fi
          fi
          # QUANT_LAKE_RETIRE_GUARD_END

          # rclone config directory bootstrap (directory mount follows host re-authorization)
          mkdir -p ~/.config/rclone
          if [ ! -f ~/.config/rclone/rclone.conf ]; then
            echo "WARNING: ~/.config/rclone/rclone.conf is missing. Please configure rclone remote credentials manually."
          fi

          if docker compose version >/dev/null 2>&1; then C="docker compose"; else C="docker-compose"; fi
          if [ "$RECREATE_NOW" = "1" ]; then
            \$C up -d --force-recreate --remove-orphans
            running_revision="\$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' krx-collector)"
            if [ "\$running_revision" != "\$GITHUB_SHA" ]; then
              echo "Running container revision mismatch: \$running_revision != \$GITHUB_SHA" >&2
              exit 1
            fi
          else
            echo "DEFERRED: krx-collector recreate scheduled by krx-deferred-recreate.timer (22:00 KST) revision=\$GITHUB_SHA"
          fi
          rm -rf ~/krx-alpha/.deploy/staging/\$GITHUB_SHA
          docker image prune -f
          EOF
