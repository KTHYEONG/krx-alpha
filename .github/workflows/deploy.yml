name: Cloud CI/CD Deploy Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/kthyeong/krx-collector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle Ampere ARM64 + AMD64 멀티아키텍처 크로스 빌드
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tailscale 가상 사설망 연결
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # SSH 배포 실행
      - name: Deploy over Tailscale
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          # SSH 키 파일 정규화 (CRLF -> LF 변환 및 끝줄 개행 강제)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          echo "" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"

          # 원격 서버 디렉터리 준비
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" "mkdir -p ~/krx-alpha/data ~/krx-alpha/logs"

          # docker-compose.yml 전송
          scp $SSH_OPTS docker-compose.yml "$REMOTE_USER@$HOST:~/krx-alpha/"

          # 원격 컨테이너 최신 이미지 pull 및 재기동
          ssh $SSH_OPTS "$REMOTE_USER@$HOST" bash -s <<EOF
          set -e
          cd ~/krx-alpha

          # .env 파일이 없으면 템플릿 생성 안내 (기존 .env 보존)
          if [ ! -f .env ]; then
            touch .env
            echo "Created empty .env. Please configure API credentials if not already set."
          fi

          echo '$GHCR_PAT' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          if docker compose version >/dev/null 2>&1; then C="docker compose"; else C="docker-compose"; fi
          \$C pull
          \$C up -d --force-recreate --remove-orphans
          docker image prune -f
          EOF
